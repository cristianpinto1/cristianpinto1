<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Transcripciones - ClasesSinBarreras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='historial_style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('main.index_page') }}" class="header-link">ClasesSinBarreras</a></h1>
        <nav id="mainNav"></nav>
    </header>

    <main class="history-page">
        <h2>Mis Transcripciones</h2>

        <div class="filter-controls">
            <div class="form-group">
                <label for="dateFilter">Filtrar por fecha:</label>
                <input type="date" id="dateFilter" name="dateFilter">
            </div>
            <div class="form-group">
                <label for="courseFilter">Filtrar por curso/etiqueta:</label>
                <input type="text" id="courseFilter" name="courseFilter" placeholder="Ej: Cálculo I">
            </div>
            <button id="applyFilterButton" class="button-primary">Aplicar Filtros</button>
            <button id="clearFilterButton" class="button-secondary">Limpiar Filtros</button>
        </div>

        <div id="transcriptionListContainer">
            <p id="loadingMessage">Cargando historial...</p>
            <!-- Las transcripciones se cargarán aquí dinámicamente -->
            <!-- La estructura del item ya no incluye el resumen -->
        </div>
        <div id="noResultsMessage" class="empty-state-message" style="display:none;">
            <p>No se encontraron transcripciones con los filtros seleccionados, o aún no tienes transcripciones guardadas.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 ClasesSinBarreras</p>
    </footer>

    <script src="{{ url_for('static', filename='auth_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='historial.js') }}"></script>
</body>
</html>
