<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClasesSinBarreras - Transcripción</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav_style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('main.index_page') }}" class="header-link">ClasesSinBarreras</a></h1>
        <nav id="mainNav">
            <!-- La navegación se poblará con JS desde auth_utils.js -->
            <!-- Los enlaces dentro de auth_utils.js también necesitarán usar url_for si es posible,
                 o mantenerse como rutas relativas que funcionarán si Flask las sirve.
                 Por ahora, asumimos que auth_utils.js usa rutas relativas como '/login' que mapearán
                 a las nuevas rutas Flask. Si no, auth_utils.js también necesitaría ajustes.
                 De momento, nos enfocamos en los href de este HTML. -->
        </nav>
    </header>
    <main class="transcription-page">
        <div class="mic-container">
            <button id="micButton" aria-label="Iniciar Transcripción">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" fill="currentColor" width="50px" height="50px">
                    <path d="M192 0C139 0 96 43 96 96V256c0 53 43 96 96 96s96-43 96-96V96c0-53-43-96-96-96zM64 216c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 89.1 66.2 162.7 152 174.4V464H120c-13.3 0-24 10.7-24 24s10.7 24 24 24h144c13.3 0 24-10.7 24-24s-10.7-24-24-24H208V430.4c85.8-11.7 152-85.3 152-174.4V216c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 70.7-57.3 128-128 128s-128-57.3-128-128V216z"/>
                </svg>
            </button>
            <div class="mic-circles">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
                <div class="circle circle-3"></div>
            </div>
        </div>

        <div class="controls-container">
            <input type="text" id="courseLabelInput" placeholder="Etiqueta de curso (opcional)">
            <div id="saveStatus" class="save-status" aria-live="polite"></div>
        </div>

        <div id="transcriptionOutput" aria-live="polite">
            <p><em>Haz clic en el micrófono para comenzar la transcripción...</em></p>
        </div>

        <div id="currentSummaryOutputContainer" class="summary-output-container" style="display:none;">
            <h3>Resumen de la Transcripción Actual:</h3>
            <div id="currentSummaryOutput" class="item-summary">
                <p><em>Generando resumen...</em></p>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 ClasesSinBarreras</p>
    </footer>
    <script src="{{ url_for('static', filename='auth_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
