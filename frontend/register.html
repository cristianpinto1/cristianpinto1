<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ClasesSinBarreras</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth_style.css">
    <link rel="stylesheet" href="nav_style.css"> <!-- Añadido nav_style.css -->
</head>
<body>
    <header>
        <h1><a href="index.html" class="header-link">ClasesSinBarreras</a></h1>
        <nav id="mainNav">
            <!-- La navegación se poblará con JS desde auth_utils.js -->
        </nav>
    </header>
    <main class="auth-page">
        <div class="auth-container">
            <h2>Crear Cuenta</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Nombre de Usuario:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="auth-button">Registrarse</button>
            </form>
            <div id="authMessage" class="auth-message" aria-live="polite"></div>
            <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 ClasesSinBarreras</p>
    </footer>
    <script src="auth_utils.js"></script> <!-- auth_utils.js primero -->
    <script src="auth.js"></script>
</body>
</html>
