<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Transcripciones - ClasesSinBarreras</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nav_style.css">
    <link rel="stylesheet" href="historial_style.css">
</head>
<body>
    <header>
        <h1><a href="index.html" class="header-link">ClasesSinBarreras</a></h1>
        <nav id="mainNav"></nav>
    </header>

    <main class="history-page">
        <h2>Mis Transcripciones</h2>

        <div class="filter-controls">
            <div class="form-group">
                <label for="dateFilter">Filtrar por fecha:</label>
                <input type="date" id="dateFilter" name="dateFilter">
            </div>
            <div class="form-group">
                <label for="courseFilter">Filtrar por curso/etiqueta:</label>
                <input type="text" id="courseFilter" name="courseFilter" placeholder="Ej: Cálculo I">
            </div>
            <button id="applyFilterButton" class="button-primary">Aplicar Filtros</button>
            <button id="clearFilterButton" class="button-secondary">Limpiar Filtros</button>
        </div>

        <div id="transcriptionListContainer">
            <p id="loadingMessage">Cargando historial...</p>
            <!-- Ejemplo de estructura de un item con resumen:
            <div class="transcription-item" data-id="1">
                <button class="delete-button" title="Eliminar transcripción" data-id="1">×</button>
                <div class="item-header">
                    <span class="item-date">2023-10-27 10:30</span>
                    <span class="item-course">Cálculo I</span>
                </div>
                <div class="item-content">
                    <p>Este es el contenido de la transcripción...</p>
                </div>
                <div class="item-summary-container">
                    <button class="toggle-summary-button" data-summary-target="summary-1">Mostrar Resumen</button>
                    <div class="item-summary" id="summary-1" style="display:none;">
                        <h4>Resumen:</h4>
                        <p>Este sería el resumen generado...</p>
                    </div>
                </div>
            </div>
            -->
        </div>
        <div id="noResultsMessage" class="empty-state-message" style="display:none;">
            <p>No se encontraron transcripciones con los filtros seleccionados, o aún no tienes transcripciones guardadas.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 ClasesSinBarreras</p>
    </footer>

    <script src="auth_utils.js"></script>
    <script src="historial.js"></script>
</body>
</html>
