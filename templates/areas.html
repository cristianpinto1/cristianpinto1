{% extends "layout.html" %}
{% block content %}
    <div class="container">
        <h1 class="mb-4">Áreas</h1>
        <a href="{{ url_for('nueva_area') }}" class="btn btn-primary mb-3">Crear Nueva Área</a>
        <a href="{{ url_for('exportar_areas') }}" class="btn btn-secondary mb-3">Exportar a CSV</a>
        <ul class="list-group">
            {% for area in areas %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ area.nombre }}</strong>
                        {% if area.parent %}
                            <small class="text-muted"> (Sub-área de: {{ area.parent.nombre }})</small>
                        {% endif %}
                    </div>
                    <div>
                        <a href="{{ url_for('editar_area', area_id=area.id) }}" class="btn btn-secondary btn-sm">Editar</a>
                        <form action="{{ url_for('eliminar_area', area_id=area.id) }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock content %}
